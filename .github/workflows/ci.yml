name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (source contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore IntentSystem.sln

      - name: Build
        run: dotnet build IntentSystem.sln --configuration Release --no-restore

      - name: Test
        env:
          G734_VERIFICATION_ROOT: ${{ github.workspace }}/.artifacts/g734-verification
        run: |
          mkdir -p .artifacts/g734-verification
          dotnet test IntentSystem.sln --configuration Release --no-build \
            --logger "trx;LogFilePrefix=test-results" \
            --results-directory "${{ github.workspace }}/.artifacts/test-results"

      - name: Emit G734 verification artifact
        if: success()
        env:
          G734_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash eng/emit-g734-verification.sh \
            --results-directory "${{ github.workspace }}/.artifacts/test-results" \
            --verification-directory "${{ github.workspace }}/.artifacts/g734-verification" \
            --head-sha "${G734_HEAD_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Verify downloaded G734 artifact pair from a consumer directory
        if: success()
        run: |
          consumer_directory="$(mktemp -d)"
          cp \
            .artifacts/g734-verification/g734-verification.json \
            .artifacts/g734-verification/g734-verification.json.sha256 \
            "${consumer_directory}/"
          (
            cd "${consumer_directory}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum --check g734-verification.json.sha256
            else
              shasum -a 256 -c g734-verification.json.sha256
            fi
          )

      - name: Upload G734 verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g734-verification
          path: .artifacts/g734-verification/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .artifacts/test-results/
          retention-days: 7

  npm-dry-run:
    name: npm package dry-run (no publish)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve CI package version from repository policy
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          NEXT_VERSION="$(python3 -c "import json; print(json.load(open('eng/version.json'))['nextVersion'])")"
          VERSION="${NEXT_VERSION}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=${VERSION}" | tee -a "${GITHUB_OUTPUT}"

      - name: Publish the Linux smoke binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          dotnet publish src/IntentSystem.Cli/IntentSystem.Cli.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version="${VERSION}" -o .artifacts/npm-binaries/linux-x64
          cp .artifacts/npm-binaries/linux-x64/IntentSystem.Cli .artifacts/npm-binaries/linux-x64/intent-cli
          chmod +x .artifacts/npm-binaries/linux-x64/intent-cli
          .artifacts/npm-binaries/linux-x64/intent-cli --version > .artifacts/npm-version.txt

      - name: Prepare all npm packages for a dry run
        shell: bash
        run: |
          set -euo pipefail
          node packaging/npm/scripts/prepare-packages.js \
            --version "${{ steps.ver.outputs.version }}" \
            --binary-root .artifacts/npm-binaries \
            --output .artifacts/npm-packages \
            --allow-missing-binaries

      - name: Pack, verify, and exercise the packed npm entry point
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p .artifacts/npm-tarballs
          for package in .artifacts/npm-packages/*; do
            npm pack "${package}" --ignore-scripts --pack-destination .artifacts/npm-tarballs
          done
          node packaging/npm/scripts/verify-packages.js \
            --packages-dir .artifacts/npm-packages \
            --expected-version "${VERSION}" \
            --version-output .artifacts/npm-version.txt
          MAIN_TGZ="$(find .artifacts/npm-tarballs -maxdepth 1 -name 'intent-system-*.tgz' -print -quit)"
          LINUX_TGZ="$(find .artifacts/npm-tarballs -maxdepth 1 -name '*intent-cli-linux-x64-*.tgz' -print -quit)"
          test -n "${MAIN_TGZ}" -a -n "${LINUX_TGZ}"
          node packaging/npm/scripts/smoke-packed.js \
            --main "${MAIN_TGZ}" --platform "${LINUX_TGZ}" --expected-version "${VERSION}" \
            --work-dir ".artifacts/npm-packed-smoke"

      - name: Upload npm dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intent-cli-npm-dry-run-${{ steps.ver.outputs.version }}
          path: .artifacts/npm-tarballs/
          retention-days: 7
