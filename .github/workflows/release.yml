# G386: release-driven distribution for intent-cli.
#
# Triggered by publishing a GitHub Release (or manually via
# workflow_dispatch for a dry run). It does three things:
#
#   1. Builds and packs the official `intent-cli` .nupkg (release build —
#      NO PrivatePreview* / expiry properties, so the artifact carries no
#      build-time expiry contract; see IntentSystem.Cli.csproj G367 block
#      and PrivatePreviewExpiryGate). When `NUGET_API_KEY` is present and
#      the run was triggered by a real release, the package is pushed to
#      NuGet.org. On forks / missing secrets the publish step is skipped
#      cleanly so the workflow still builds and attaches artifacts.
#
#   2. Builds SDK-free self-contained single-file binaries for
#      osx-arm64, win-x64, and linux-x64 on matching runners, smoke-tests
#      `intent-cli --version`, and archives each with a SHA-256 sidecar.
#
#   3. Prepares the npm entry package plus its per-platform optional packages,
#      verifies checksums/version identity, and publishes them only on the same
#      real-release event through GitHub Actions OIDC trusted publishing.
#
#   4. Attaches the .nupkg, npm packages, and per-platform binary archives
#      (plus checksums) to the triggering GitHub Release.
#
# Non-SDK users install by downloading a release binary; SDK users run
# `dotnet tool install -g JTechJapan.IntentSystem.Cli`. See README.md "Install".
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for a dry run (e.g. 0.2.0). Defaults to a dryrun suffix. Real releases derive the version from the release tag."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-reachability:
    name: Verify release commit reachability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch repository default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Gate exact commit being released
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_COMMIT="${WORKFLOW_COMMIT}"
          if [ "${EVENT_NAME}" = "release" ]; then
            test -n "${RELEASE_TAG}"
            RELEASE_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          fi
          ./eng/release-reachability.sh \
            --commit "${RELEASE_COMMIT}" \
            --default-branch "${DEFAULT_BRANCH}"

      - name: Survey all existing version tags
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          ./eng/release-reachability.sh \
            --survey \
            --default-branch "${DEFAULT_BRANCH}"

  nupkg:
    name: NuGet package
    needs: [release-reachability]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ github.event.inputs.version }}"
          fi
          # Strip a leading v from tags like v0.3.0.
          VERSION="${RAW#v}"
          if [ -z "${VERSION}" ]; then
            # G401: derive the dry-run default from the repository version
            # policy so the dry-run version stays in sync with nextVersion.
            NEXT_VERSION="$(python3 -c "import json; data=json.load(open('eng/version.json')); print(data['nextVersion'])" 2>/dev/null || echo "0.3.0")"
            VERSION="${NEXT_VERSION}-dryrun.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=${VERSION}" | tee -a "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore IntentSystem.sln

      - name: Build
        run: dotnet build IntentSystem.sln --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test IntentSystem.sln --configuration Release --no-build \
            --logger "trx;LogFilePrefix=test-results" \
            --results-directory "${GITHUB_WORKSPACE}/.artifacts/test-results"

      - name: Pack release .nupkg (no preview properties; stable tag-driven version)
        run: |
          dotnet pack src/IntentSystem.Cli/IntentSystem.Cli.csproj \
            --configuration Release \
            -o .artifacts/release \
            -p:Version=${{ steps.ver.outputs.version }}

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd .artifacts/release
          # G407: package id changed to JTechJapan.IntentSystem.Cli
          for f in JTechJapan.IntentSystem.Cli.*.nupkg; do
            sha256sum "${f}" > "${f}.sha256"
          done
          cat ./*.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: intent-cli-nupkg-${{ steps.ver.outputs.version }}
          path: .artifacts/release/*

      - name: Attach .nupkg to GitHub Release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            .artifacts/release/JTechJapan.IntentSystem.Cli.*.nupkg \
            .artifacts/release/JTechJapan.IntentSystem.Cli.*.nupkg.sha256 \
            --repo "${{ github.repository }}" --clobber

      - name: Publish to NuGet.org (guarded; skips on forks / missing secret)
        if: ${{ github.event_name == 'release' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            echo "NUGET_API_KEY is not set (fork or missing secret); skipping NuGet publish."
            echo "Artifacts were still built and attached to the release."
            exit 0
          fi
          dotnet nuget push .artifacts/release/JTechJapan.IntentSystem.Cli.*.nupkg \
            --api-key "${NUGET_API_KEY}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

  binaries:
    name: Self-contained ${{ matrix.rid }}
    needs: [release-reachability]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ github.event.inputs.version }}"
          fi
          VERSION="${RAW#v}"
          if [ -z "${VERSION}" ]; then
            # G406: derive the dry-run default from the repository version
            # policy so the dry-run version stays in sync with nextVersion.
            NEXT_VERSION="$(python3 -c "import json; data=json.load(open('eng/version.json')); print(data['nextVersion'])" 2>/dev/null || echo "0.3.1")"
            VERSION="${NEXT_VERSION}-dryrun.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=${VERSION}" | tee -a "${GITHUB_OUTPUT}"

      # Self-contained single-file publish bundles the .NET runtime, so the
      # produced binary runs without a preinstalled .NET SDK. No
      # PrivatePreview* properties are passed, so there is no build-time
      # expiry contract on release binaries.
      - name: Publish self-contained single-file binary
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/IntentSystem.Cli/IntentSystem.Cli.csproj \
            --configuration Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o "publish/${{ matrix.rid }}"

      # The published apphost is named after the assembly
      # (IntentSystem.Cli); stage it under the user-facing `intent-cli`
      # command name for the release asset.
      - name: Stage binary as intent-cli
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}"
          SRCDIR="publish/${RID}"
          mkdir -p stage
          if [ "${RID}" = "win-x64" ]; then
            cp "${SRCDIR}/IntentSystem.Cli.exe" "stage/intent-cli.exe"
            echo "bin=stage/intent-cli.exe" | tee -a "${GITHUB_OUTPUT}"
          else
            cp "${SRCDIR}/IntentSystem.Cli" "stage/intent-cli"
            chmod +x "stage/intent-cli"
            echo "bin=stage/intent-cli" | tee -a "${GITHUB_OUTPUT}"
          fi

      - name: Smoke test --version (no .NET SDK needed by the self-contained binary)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          OUTPUT="$("${{ steps.stage.outputs.bin }}" --version)"
          printf '%s\n' "${OUTPUT}"
          FIRST_LINE="$(printf '%s\n' "${OUTPUT}" | sed -n '1p')"
          case "${FIRST_LINE}" in
            "intent-cli ${VERSION}"|"intent-cli ${VERSION}-"*|"intent-cli ${VERSION}+"*) ;;
            *) echo "binary version '${FIRST_LINE}' does not match release version '${VERSION}'" >&2; exit 1 ;;
          esac

      - name: Archive + checksum
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          RID="${{ matrix.rid }}"
          NAME="intent-cli-${VERSION}-${RID}"
          mkdir -p dist
          if [ "${RID}" = "win-x64" ]; then
            ASSET="dist/${NAME}.zip"
            7z a -tzip "${ASSET}" "./stage/intent-cli.exe" >/dev/null
          else
            ASSET="dist/${NAME}.tar.gz"
            tar -czf "${ASSET}" -C stage "intent-cli"
          fi
          # G409: cd into dist so the sidecar records only the basename, not
          # the dist/ path prefix, allowing users to verify from the download
          # directory without recreating the CI folder layout.
          BASENAME="$(basename "${ASSET}")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${BASENAME}" > "${BASENAME}.sha256")
          else
            (cd dist && shasum -a 256 "${BASENAME}" > "${BASENAME}.sha256")
          fi
          echo "asset=${ASSET}" | tee -a "${GITHUB_OUTPUT}"
          cat "${ASSET}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: intent-cli-${{ matrix.rid }}-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Attach binary to GitHub Release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ steps.pack.outputs.asset }}" \
            "${{ steps.pack.outputs.asset }}.sha256" \
            --repo "${{ github.repository }}" --clobber

  npm:
    name: npm packages
    needs: [nupkg, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for release packaging
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Pin npm CLI for trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "11.5.1"

      - name: Resolve the same tag-derived release version as NuGet and binaries
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ github.event.inputs.version }}"
          fi
          VERSION="${RAW#v}"
          if [ -z "${VERSION}" ]; then
            NEXT_VERSION="$(python3 -c "import json; data=json.load(open('eng/version.json')); print(data['nextVersion'])" 2>/dev/null || echo "0.3.0")"
            VERSION="${NEXT_VERSION}-dryrun.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=${VERSION}" | tee -a "${GITHUB_OUTPUT}"

      - name: Download the exact binary artifacts produced by the release matrix
        uses: actions/download-artifact@v4
        with:
          pattern: intent-cli-*
          path: .artifacts/release-assets
          merge-multiple: true

      - name: Rebuild npm platform packages from release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          for RID in osx-arm64 linux-x64 win-x64; do
            case "${RID}" in
              osx-arm64) ARCHIVE="intent-cli-${VERSION}-osx-arm64.*"; BINARY="intent-cli" ;;
              linux-x64) ARCHIVE="intent-cli-${VERSION}-linux-x64.*"; BINARY="intent-cli" ;;
              win-x64) ARCHIVE="intent-cli-${VERSION}-win-x64.*"; BINARY="intent-cli.exe" ;;
            esac
            ASSET="$(find .artifacts/release-assets -type f -name "${ARCHIVE}" ! -name '*.sha256' -print -quit)"
            test -n "${ASSET}"
            EXTRACT=".artifacts/extract/${RID}"
            mkdir -p "${EXTRACT}"
            case "${ASSET}" in
              *.tar.gz) tar -xzf "${ASSET}" -C "${EXTRACT}" ;;
              *.zip) unzip -q "${ASSET}" -d "${EXTRACT}" ;;
              *) echo "unsupported binary asset: ${ASSET}" >&2; exit 1 ;;
            esac
            mkdir -p ".artifacts/npm-binaries/${RID}"
            cp "$(find "${EXTRACT}" -type f -name "${BINARY}" -print -quit)" ".artifacts/npm-binaries/${RID}/${BINARY}"
            if [ "${BINARY}" != "intent-cli.exe" ]; then chmod +x ".artifacts/npm-binaries/${RID}/${BINARY}"; fi
          done
          .artifacts/npm-binaries/linux-x64/intent-cli --version > .artifacts/npm-version.txt
          node packaging/npm/scripts/prepare-packages.js \
            --version "${VERSION}" --binary-root .artifacts/npm-binaries --output .artifacts/npm-packages

      - name: Pack and verify npm packages without publishing
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p .artifacts/npm-tarballs
          for package in .artifacts/npm-packages/*; do
            npm pack "${package}" --ignore-scripts --pack-destination .artifacts/npm-tarballs
          done
          node packaging/npm/scripts/verify-packages.js \
            --packages-dir .artifacts/npm-packages --expected-version "${VERSION}" \
            --version-output .artifacts/npm-version.txt --require-real-binaries
          for file in .artifacts/npm-tarballs/*.tgz; do
            sha256sum "${file}" > "${file}.sha256"
          done

      - name: Upload npm workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: intent-cli-npm-${{ steps.ver.outputs.version }}
          path: .artifacts/npm-tarballs/*

      - name: Attach npm packages to GitHub Release
        if: ${{ github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            .artifacts/npm-tarballs/* \
            --repo "${{ github.repository }}" --clobber

      - name: Publish npm packages through OIDC trusted publishing
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          publish_package() {
            local package_path="$1"
            local package_name="$2"
            local publish_output
            if ! publish_output="$(npm publish "${package_path}" --access public 2>&1)"; then
              printf '%s\n' "${publish_output}" >&2
              classify_publish_failure "${package_name}" "${publish_output}"
              return 1
            fi
            printf '%s\n' "${publish_output}"
          }

          classify_publish_failure() {
            local package_name="$1"
            local publish_output="$2"
            if printf '%s\n' "${publish_output}" | grep -Eiq 'E422|provenance|repository information|Unprocessable Entity'; then
              echo "npm registry/provenance rejection for package ${package_name}: the authenticated publish reached npm but the registry rejected the package metadata. Clear this by publishing a package whose repository.url matches https://github.com/J-Tech-Japan/intent-system, then rerun this release publish." >&2
            elif printf '%s\n' "${publish_output}" | grep -Eiq 'E401|ENEEDAUTH|E403|not authorized|authentication|trusted publisher'; then
              echo "npm trusted publishing authentication failure for package ${package_name}: the publish could not authenticate with npm. Clear this by registering this package's npmjs.com trusted publisher for repository ${GITHUB_REPOSITORY} and workflow .github/workflows/release.yml, keeping id-token: write on the npm job, then rerun this release publish." >&2
            else
              echo "npm publish failure for package ${package_name}: the registry or client rejected the request; the npm output above is the source of the failure. Clear this by correcting the reported publish error, then rerun this release publish." >&2
            fi
          }

          publish_package \
            .artifacts/npm-tarballs/j-tech-japan-intent-cli-darwin-arm64-*.tgz \
            "@j-tech-japan/intent-cli-darwin-arm64"
          publish_package \
            .artifacts/npm-tarballs/j-tech-japan-intent-cli-linux-x64-*.tgz \
            "@j-tech-japan/intent-cli-linux-x64"
          publish_package \
            .artifacts/npm-tarballs/j-tech-japan-intent-cli-win32-x64-*.tgz \
            "@j-tech-japan/intent-cli-win32-x64"
          publish_package \
            .artifacts/npm-tarballs/intent-system-*.tgz \
            "intent-system"
